version: 2
updates:
  # GitHub Actions used by the workflows (ci.yml, release.yml)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * mon#1,mon#2"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
