<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig used by src/build-brand.mjs so card
  text renders with the exact site fonts (Space Grotesk / JetBrains Mono)
  regardless of what is installed on the machine.
-->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
